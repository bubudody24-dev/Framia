<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111319" />
    <meta name="description" content="Framia — estúdio de desenho, animação e criação colaborativa." />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <title>Framia — Estúdio criativo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Preview-only: adding ?as=<name> lets the owner open a second, throwaway
      // participant in another tab. The Worker honours the header only for the
      // account in FRAMIA_TEST_OWNER, so this is a no-op for everyone else.
      (() => {
        const as = new URLSearchParams(location.search).get('as');
        if (!as) return;
        const call = window.fetch.bind(window);
        window.fetch = (input, init) => {
          const headers = new Headers(init?.headers || (input instanceof Request ? input.headers : undefined));
          headers.set('x-framia-test', as);
          return call(input, { ...init, headers });
        };
      })();
    </script>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
